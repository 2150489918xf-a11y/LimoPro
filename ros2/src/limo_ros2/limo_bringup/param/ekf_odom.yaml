local_ekf:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    reset_on_time_jump: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    use_control: false

    # State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # Raw chassis pose already uses IMU yaw. Fuse body velocities only.
    odom0: /odom/raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 20
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # Gyro Z only: do not double-count raw yaw, or integrate uncalibrated acceleration.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 30
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
